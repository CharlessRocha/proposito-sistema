<style>
  /* ═══ Tendências 2026 — micro-interações, acessibilidade, formas orgânicas ═══ */

  /* Acessibilidade: foco visível para navegação por teclado */
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid #b8860b; outline-offset:2px;
  }
  /* Áreas de toque maiores no mobile (mínimo 40px) */
  @media(max-width:600px){
    button, .f-btn, .acao-btn, .tab, .id-btn, .check{min-height:38px}
  }

  /* Micro-interações: cards "levantam" sutilmente ao passar o mouse */
  .card, .kpi, .lead-card, .neg-item, .sala, .sel-card, .doc-card{
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover, .kpi:hover, .lead-card:hover, .doc-card:hover{
    transform:translateY(-2px);
  }
  /* Botões: resposta tátil ao clicar */
  button:active, .f-btn:active, .acao-btn:active, .tab:active{transform:scale(.96)}

  /* Checkbox de tarefa: "pop" ao marcar como concluída */
  @keyframes popCheck{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .check.checked{animation:popCheck .28s cubic-bezier(.34,1.56,.64,1)}

  /* Formas orgânicas: mancha suave decorativa no cabeçalho */
  .blob-decor{position:absolute;top:-60px;right:-40px;width:180px;height:180px;
    background:radial-gradient(circle at 30% 30%, rgba(245,200,66,.16), rgba(245,200,66,0) 70%);
    border-radius:50%;pointer-events:none;z-index:0}

  /* Tipografia com mais personalidade nos títulos principais */
  .page-title{letter-spacing:-.02em}

  .nav-jump{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #e8e0d0;background:#fff;color:#5c5346;font-family:inherit;cursor:pointer;max-width:150px}
  .nav-jump:hover{border-color:#b8860b}

  /* ═══ Refinamento visual — sombras suaves e transições elegantes ═══ */

  .card,.kpi,.lead-card,.neg-item,.ent-row,.sala,.sel-card,.fase,.alerta-card,.ld-grupo,.doc-card,.t-notas-panel{box-shadow:0 1px 2px rgba(43,38,32,.04), 0 1px 6px rgba(43,38,32,.03)}

  button,.tab,.f-btn,.acao-btn,.modulo-btn,.id-btn,.save-btn,.add-btn,.nav-back{transition:all .15s ease}
  button:active{transform:scale(.97)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#d8cfbe;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#c9bfa8}

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#faf8f4;color:#4a4238;min-height:100vh}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#ffffff;border-bottom:1px solid #e8e0d0;position:sticky;top:0;z-index:50}

  .nav-modulo{font-size:12px;color:#7d7364;background:#f5f1e8;padding:3px 10px;border-radius:20px;border:1px solid #e8e0d0}
  .nav-back{font-size:12px;color:#7d7364;background:none;border:1px solid #e8e0d0;border-radius:6px;padding:5px 10px;cursor:pointer;font-family:inherit}
  .nav-back:hover{color:#b8860b;border-color:#b8860b}
  .main{max-width:900px;margin:0 auto;padding:1.25rem 1rem 4rem}
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
  .page-title{font-size:20px;font-weight:700;color:#2b2620}

  .tabs{display:flex;gap:4px;margin-bottom:1.25rem;background:#ffffff;border-radius:8px;padding:4px;border:1px solid #e8e0d0}
  .tab{flex:1;padding:7px 6px;border:none;background:transparent;border-radius:6px;font-size:12px;font-weight:500;color:#7d7364;cursor:pointer;text-align:center;font-family:inherit}

  /* KPI */
  .kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:1.25rem}
  @media(max-width:560px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}

  .kpi.danger .kpi-val{color:#dc2626}
  .kpi.accent .kpi-val{color:#b8860b}

  /* LISTA */
  .lista-wrap{background:#ffffff;border-radius:10px;border:1px solid #e8e0d0;overflow:hidden}
  .ent-row{padding:11px 16px;border-bottom:1px solid #e8e0d0;font-size:12px}
  .ent-row:last-child{border-bottom:none}
  .ent-row:hover{background:#f7f3ea}
  .ent-top{display:flex;align-items:center;gap:10px}

  .sp-atrasada{background:#fdecec;color:#dc2626}
  .sp-planejada{background:#fff3d6;color:#b8860b}
  .sp-ganho{background:#eafaf0;color:#16a34a}
  .r-nome{font-size:13px;font-weight:500;color:#2b2620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-sub{font-size:11px;color:#9c9280;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .r-data{text-align:right;flex-shrink:0}
  .r-hora{font-size:13px;font-weight:600;color:#b8860b}
  .r-dia{font-size:10px;color:#9c9280}
  .ent-controls{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .modal-btn{font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #e8e0d0;background:#f5f1e8;color:#7d7364;cursor:pointer;font-family:inherit}
  .modal-btn:hover{background:#f7f3ea}
  .modal-btn.on{border-color:#b8860b;background:#fff3d6;color:#b8860b}
  .link-input{font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #e8e0d0;background:#f5f1e8;color:#2563eb;flex:1;min-width:140px;font-family:inherit}
  .copy-btn{font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #16a34a;background:#eafaf0;color:#22c55e;cursor:pointer;font-family:inherit}

  /* Filtros */
  .filtros{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
  .f-btn{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid #e8e0d0;background:#ffffff;color:#7d7364;cursor:pointer;font-weight:500;font-family:inherit}
  .f-btn.active{background:#fff3d6;color:#b8860b;border-color:#b8860b}

  /* Lista do dia */
  .ld-grupo{background:#ffffff;border-radius:10px;border:1px solid #e8e0d0;overflow:hidden;margin-bottom:10px}
  .ld-head{padding:10px 14px;background:#f7f3ea;border-bottom:1px solid #e8e0d0;font-size:13px;font-weight:600;color:#3d362c;display:flex;justify-content:space-between}
  .copy-list-btn{font-size:11px;padding:6px 12px;border-radius:8px;border:1px solid #e8e0d0;background:#ffffff;color:#7d7364;cursor:pointer;font-family:inherit}
  .copy-list-btn:hover{border-color:#b8860b;color:#b8860b}

  .empty{padding:24px;text-align:center;font-size:13px;color:#9c9280}
  #auth-check{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#faf8f4;z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px}
</style>

<script>
if(sessionStorage.getItem('acesso_entrevistas')!=='1'){document.getElementById('auth-check').style.display='flex';}

const HOJE=new Date();HOJE.setHours(0,0,0,0);
document.getElementById('data-hoje').textContent=HOJE.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

let atividades=[];
let propostas=[];
let leads=[];
let filtroTodas='todas';

function fmtDataHora(dv){
  const partes=(dv||'').split(' ');
  return {data:partes[0]||'', hora:partes[1]||'—'};
}

function getPropostaAuto(nome, codigoExterno){
  // Tenta primeiro pelo código (mais confiável) — Código externo da pessoa costuma bater com COD. Inscrição
  if(codigoExterno){
    const porCodigo=propostas.find(p=>(p['COD. Inscrição']||'').trim()===codigoExterno.trim());
    if(porCodigo) return porCodigo;
  }
  // Fallback por nome
  if(!nome) return null;
  return propostas.find(p=>{
    const nomeP=(p['Aluno']||'').toLowerCase().trim();
    const nomeA=nome.toLowerCase().trim();
    return nomeP===nomeA||nomeP.includes(nomeA)||nomeA.includes(nomeP);
  })||null;
}

// Cruza pela chave real (Código externo da pessoa) — muito mais confiável que nome
function getLeadPorCodigo(codigoPessoa){
  if(!codigoPessoa) return null;
  return leads.find(l=>l['CodigoExterno']&&l['CodigoExterno']===codigoPessoa)||null;
}

function isMatriculado(a){
  const lead=getLeadPorCodigo(a['CodigoPessoa']);
  return lead && lead['Etapa']==='Matrícula';
}

async function init(){
  atividades = await supa.getAtividades();
  propostas = await supa.getPropostas();
  leads = await supa.getLeads();
  popularUnidades();
  renderTudo();
}

function popularUnidades(){
  const unidades=[...new Set(atividades.map(a=>a['Unidade']).filter(Boolean))].sort();
  const sel=document.getElementById('filtro-unid');
  const atual=sel.value;
  sel.innerHTML='<option value="">Todas as unidades</option>'+unidades.map(u=>`<option ${u===atual?'selected':''}>${u}</option>`).join('');
}

function getAtividadesFiltradas(){
  const u=document.getElementById('filtro-unid').value;
  // Entrevistas de interesse: as que têm etapa de entrevista ou proposta (não leads ainda no início do funil)
  let lista=atividades.filter(a=>['Atrasada','Planejada','Ganho'].includes(a['Status']));
  if(u) lista=lista.filter(a=>a['Unidade']===u);
  return lista;
}

function renderTudo(){renderKPIs();renderTodas();renderAlertas();renderListaDia();}

function renderKPIs(){
  const lista=getAtividadesFiltradas();
  const hoje=lista.filter(a=>{
    const {data}=fmtDataHora(a['Data de vencimento']);
    const d=parseData(data);
    return d && d.getTime()===HOJE.getTime();
  });
  const atrasadas=lista.filter(a=>a['Status']==='Atrasada').length;
  const planejadas=lista.filter(a=>a['Status']==='Planejada').length;
  const ganhas=lista.filter(a=>a['Status']==='Ganho').length;
  const semTel=lista.filter(a=>!a['Telefone']||a['Telefone']==='- - -').length;
  document.getElementById('kpi-strip').innerHTML=`
    <div class="kpi accent"><div class="kpi-label">Total</div><div class="kpi-val">${lista.length}</div><div class="kpi-sub">${hoje.length} hoje</div></div>
    <div class="kpi danger"><div class="kpi-label">Atrasadas</div><div class="kpi-val">${atrasadas}</div><div class="kpi-sub">precisam de ação</div></div>
    <div class="kpi warning"><div class="kpi-label">Planejadas</div><div class="kpi-val">${planejadas}</div><div class="kpi-sub">agendadas</div></div>
    <div class="kpi success"><div class="kpi-label">Ganhas</div><div class="kpi-val">${ganhas}</div><div class="kpi-sub">convertidas</div></div>
    <div class="kpi ${semTel>0?'warning':'success'}"><div class="kpi-label">Sem telefone</div><div class="kpi-val">${semTel}</div><div class="kpi-sub">de ${lista.length}</div></div>`;
  document.getElementById('badge-al').textContent=atrasadas||'';

  // Segunda linha: resultado das entrevistas realizadas
  const comProposta=lista.filter(a=>getPropostaAuto(a['Contato'], a['CodigoPessoa'])||a['Resultado']==='sucesso').length;
  const reagendou=lista.filter(a=>a['Resultado']==='reagendou').length;
  const semRetorno=lista.filter(a=>a['Resultado']==='sem_retorno').length;
  const desistiu=lista.filter(a=>a['Resultado']==='desistiu').length;
  const pendente=lista.filter(a=>!getPropostaAuto(a['Contato'], a['CodigoPessoa'])&&!a['Resultado']&&a['Status']!=='Atrasada'&&a['Status']!=='Planejada').length;
  const outro=lista.filter(a=>a['Resultado']==='outro').length;
  const matriculadoSemProposta=lista.filter(a=>isMatriculado(a)&&!getPropostaAuto(a['Contato'], a['CodigoPessoa'])).length;
  document.getElementById('kpi-strip-resultado').innerHTML=`
    ${matriculadoSemProposta>0?`<div class="kpi danger" style="border:2px solid #dc2626"><div class="kpi-label">🚨 Matriculado sem proposta</div><div class="kpi-val">${matriculadoSemProposta}</div><div class="kpi-sub">cadastrar urgente</div></div>`:''}
    <div class="kpi success"><div class="kpi-label">✅ Deu certo</div><div class="kpi-val">${comProposta}</div><div class="kpi-sub">proposta cadastrada</div></div>
    <div class="kpi warning"><div class="kpi-label">🔁 Reagendou</div><div class="kpi-val">${reagendou}</div></div>
    <div class="kpi"><div class="kpi-label">📵 Sem retorno</div><div class="kpi-val">${semRetorno}</div></div>
    <div class="kpi danger"><div class="kpi-label">❌ Desistiu</div><div class="kpi-val">${desistiu}</div></div>`;
}

function parseData(str){
  if(!str)return null;
  const m=str.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m)return null;
  const d=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
  d.setHours(0,0,0,0);
  return d;
}

function cor(status){
  return status==='Atrasada'?'sp-atrasada':status==='Ganho'?'sp-ganho':'sp-planejada';
}

function rowHtml(a){
  const {data,hora}=fmtDataHora(a['Data de vencimento']);
  const isOnline=a['Modalidade']==='online';
  const nomeC=(a['Contato']||'').replace(/'/g,"\\'");
  const linkSafe=(a['Link']||'').replace(/'/g,"\\'");
  const propAuto=getPropostaAuto(a['Contato'], a['CodigoPessoa']);
  const matriculado=isMatriculado(a);
  const resultado=a['Resultado']||'';

  let resultadoHtml='';
  if(matriculado && !propAuto){
    // Caso crítico: aluno já matriculado nos Registros mas SEM proposta cadastrada
    resultadoHtml=`<div style="background:#fdecec;border:2px solid #dc2626;border-radius:6px;padding:8px 10px;margin-top:6px;font-size:11px;color:#ef4444;display:flex;align-items:center;gap:6px">
      🚨 <strong>Matriculado mas SEM proposta cadastrada!</strong> Cadastre a proposta urgente no sistema de admissões.
    </div>`;
  } else if(matriculado){
    resultadoHtml=`<div style="background:#eafaf0;border:1px solid #16a34a;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#22c55e;display:flex;align-items:center;gap:6px">
      🎓 <strong>Matriculado</strong> <span style="color:#22c55e88">— confirmado nos Registros</span>
    </div>`;
  } else if(propAuto){
    resultadoHtml=`<div style="background:#eafaf0;border:1px solid #16a34a;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#22c55e;display:flex;align-items:center;gap:6px">
      ✅ <strong>Proposta cadastrada</strong> <span style="color:#22c55e88">— detectado automaticamente</span>
    </div>`;
  } else if(resultado==='sucesso'){
    resultadoHtml=`<div style="background:#eafaf0;border:1px solid #16a34a;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#22c55e;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>✅ <strong>Proposta cadastrada</strong> — marcado manualmente</span>
      <button type="button" onclick="limparResultado('${a['_id']}')" style="font-size:10px;color:#4ade8088;background:none;border:none;cursor:pointer;font-family:inherit">desfazer</button>
    </div>`;
  } else if(resultado==='reagendou'){
    resultadoHtml=`<div style="background:#fff6e0;border:1px solid #d97706;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#f59e0b;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>🔁 <strong>Cliente reagendou</strong>${a['ResultadoObs']?' — '+a['ResultadoObs']:''}</span>
      <button type="button" onclick="limparResultado('${a['_id']}')" style="font-size:10px;color:#fbbf2488;background:none;border:none;cursor:pointer;font-family:inherit">desfazer</button>
    </div>`;
  } else if(resultado==='sem_retorno'){
    resultadoHtml=`<div style="background:#ffffff;border:1px solid #9c9280;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#6b6255;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>📵 <strong>Não foi e sem retorno</strong>${a['ResultadoObs']?' — '+a['ResultadoObs']:''}</span>
      <button type="button" onclick="limparResultado('${a['_id']}')" style="font-size:10px;color:#99999988;background:none;border:none;cursor:pointer;font-family:inherit">desfazer</button>
    </div>`;
  } else if(resultado==='desistiu'){
    resultadoHtml=`<div style="background:#fdecec;border:1px solid #dc2626;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#ef4444;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>❌ <strong>Cliente desistiu</strong>${a['ResultadoObs']?' — '+a['ResultadoObs']:''}</span>
      <button type="button" onclick="limparResultado('${a['_id']}')" style="font-size:10px;color:#f8717188;background:none;border:none;cursor:pointer;font-family:inherit">desfazer</button>
    </div>`;
  } else if(resultado==='outro'){
    resultadoHtml=`<div style="background:#ffffff;border:1px solid #e8e0d0;border-radius:6px;padding:6px 10px;margin-top:6px;font-size:11px;color:#5c5346;display:flex;align-items:center;justify-content:space-between;gap:6px">
      <span>✏️ <strong>${a['ResultadoObs']||'Outro motivo'}</strong></span>
      <button type="button" onclick="limparResultado('${a['_id']}')" style="font-size:10px;color:#aaaaaa88;background:none;border:none;cursor:pointer;font-family:inherit">desfazer</button>
    </div>`;
  } else {
    resultadoHtml=`<div style="margin-top:8px">
      <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#9c9280;margin-bottom:5px">Resultado da entrevista</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button type="button" onclick="marcarResultado('${a['_id']}','sucesso')" style="font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #16a34a;background:#eafaf0;color:#22c55e;cursor:pointer;font-family:inherit">✅ Deu certo</button>
        <button type="button" onclick="marcarResultado('${a['_id']}','reagendou')" style="font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #d97706;background:#fff6e0;color:#f59e0b;cursor:pointer;font-family:inherit">🔁 Reagendou</button>
        <button type="button" onclick="marcarResultado('${a['_id']}','sem_retorno')" style="font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #9c9280;background:#ffffff;color:#6b6255;cursor:pointer;font-family:inherit">📵 Sem retorno</button>
        <button type="button" onclick="marcarResultado('${a['_id']}','desistiu')" style="font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #dc2626;background:#fdecec;color:#ef4444;cursor:pointer;font-family:inherit">❌ Desistiu</button>
        <button type="button" onclick="marcarOutro('${a['_id']}')" style="font-size:10px;padding:4px 9px;border-radius:6px;border:1px solid #e8e0d0;background:#f5f1e8;color:#7d7364;cursor:pointer;font-family:inherit">✏️ Outro</button>
      </div>
    </div>`;
  }

  return`<div class="ent-row">
    <div class="ent-top">
      <span class="sp ${cor(a['Status'])}">${a['Status']}</span>
      <div style="flex:1;min-width:0">
        <div class="r-nome">${a['Contato']}</div>
        <div class="r-sub">
          <span style="color:#5c5346">${a['Segmento']||a['Nome - Oferta de curso']||''}</span>
          <span>${a['Unidade']||''}</span>
          <span style="color:#7d7364">👤 ${a['Responsável']||'—'}</span>
          ${a['Telefone']&&a['Telefone']!='- - -'?`<span style="color:#2563eb">📞 ${a['Telefone']}</span>`:'<span style="color:#9c9280">📞 sem telefone</span>'}
        </div>
        <div style="font-size:10px;color:#948a7c;margin-top:2px">${a['Nome - Processo seletivo']||''}</div>
      </div>
      <div class="r-data">
        <div class="r-hora">${hora}</div>
        <div class="r-dia">${data}</div>
      </div>
    </div>
    <div class="ent-controls">
      <button type="button" class="modal-btn ${isOnline?'on':''}" onclick="toggleModalidade('${a['_id']}',${!isOnline})">${isOnline?'🖥️ Online':'🏢 Presencial'}</button>
      ${isOnline?`
        <input type="text" class="link-input" placeholder="Cole o link do Meet..." value="${a['Link']||''}" onchange="salvarLinkMeet('${a['_id']}',this.value)">
        ${a['Link']?`<button type="button" class="copy-btn" onclick="copiarMsgEntrevista('${nomeC}','${data}','${hora}','${linkSafe}')">📋 Copiar mensagem</button>`:''}
      `:''}
    </div>
    ${resultadoHtml}
  </div>`;
}

async function marcarResultado(id, resultado, obs){
  await supa.atualizarAtividade(id, {resultado, resultado_obs: obs||null});
  const a=atividades.find(x=>String(x['_id'])===String(id));
  if(a){a['Resultado']=resultado;a['ResultadoObs']=obs||'';}
  renderTudo();
}

function marcarOutro(id){
  const motivo=prompt('Descreva o motivo:');
  if(motivo===null)return;
  marcarResultado(id,'outro',motivo);
}

async function limparResultado(id){
  await supa.atualizarAtividade(id, {resultado:null, resultado_obs:null});
  const a=atividades.find(x=>String(x['_id'])===String(id));
  if(a){a['Resultado']='';a['ResultadoObs']='';}
  renderTudo();
}

function renderTodas(){
  const lista=getAtividadesFiltradas();
  const filtros=[
    {id:'todas',label:`Todas (${lista.length})`},
    {id:'atrasadas',label:`Atrasadas (${lista.filter(a=>a['Status']==='Atrasada').length})`},
    {id:'planejadas',label:`Planejadas (${lista.filter(a=>a['Status']==='Planejada').length})`},
    {id:'online',label:`Online (${lista.filter(a=>a['Modalidade']==='online').length})`},
    {id:'sem-tel',label:`Sem telefone (${lista.filter(a=>!a['Telefone']||a['Telefone']==='- - -').length})`},
    {id:'sucesso',label:`✅ Deu certo (${lista.filter(a=>getPropostaAuto(a['Contato'], a['CodigoPessoa'])||a['Resultado']==='sucesso').length})`},
    {id:'sem-resultado',label:`Sem resultado (${lista.filter(a=>!getPropostaAuto(a['Contato'], a['CodigoPessoa'])&&!a['Resultado']).length})`},
  ];
  document.getElementById('filtros-todas').innerHTML=filtros.map(f=>`
    <button type="button" class="f-btn ${filtroTodas===f.id?'active':''}" onclick="setFiltro('${f.id}')">${f.label}</button>`).join('');

  let fl=lista;
  if(filtroTodas==='atrasadas')fl=lista.filter(a=>a['Status']==='Atrasada');
  if(filtroTodas==='planejadas')fl=lista.filter(a=>a['Status']==='Planejada');
  if(filtroTodas==='online')fl=lista.filter(a=>a['Modalidade']==='online');
  if(filtroTodas==='sem-tel')fl=lista.filter(a=>!a['Telefone']||a['Telefone']==='- - -');
  if(filtroTodas==='sucesso')fl=lista.filter(a=>getPropostaAuto(a['Contato'], a['CodigoPessoa'])||a['Resultado']==='sucesso');
  if(filtroTodas==='sem-resultado')fl=lista.filter(a=>!getPropostaAuto(a['Contato'], a['CodigoPessoa'])&&!a['Resultado']);

  fl=[...fl].sort((a,b)=>(a['Data de vencimento']||'').localeCompare(b['Data de vencimento']||''));
  document.getElementById('todas-lista').innerHTML=fl.length?fl.map(rowHtml).join(''):'<div class="empty">Nenhuma entrevista nesta categoria. Importe o CSV de Atividades no Painel do Gerente.</div>';
}

function renderAlertas(){
  const lista=getAtividadesFiltradas().filter(a=>a['Status']==='Atrasada');
  const sorted=[...lista].sort((a,b)=>(a['Data de vencimento']||'').localeCompare(b['Data de vencimento']||''));
  document.getElementById('alertas-lista').innerHTML=sorted.length?sorted.map(rowHtml).join(''):'<div class="empty">✓ Nenhuma entrevista atrasada</div>';
}

function renderListaDia(){
  const lista=getAtividadesFiltradas().filter(a=>{
    const {data}=fmtDataHora(a['Data de vencimento']);
    const d=parseData(data);
    return d && d.getTime()===HOJE.getTime();
  });
  if(!lista.length){document.getElementById('lista-dia-body').innerHTML='<div class="empty">Nenhuma entrevista hoje</div>';return;}
  const por={};
  lista.forEach(a=>{const u=a['Unidade']||'Sem unidade';if(!por[u])por[u]=[];por[u].push(a);});
  document.getElementById('lista-dia-body').innerHTML=Object.entries(por).map(([u,items])=>{
    const sorted=[...items].sort((a,b)=>(a['Data de vencimento']||'').localeCompare(b['Data de vencimento']||''));
    return`<div class="ld-grupo">
      <div class="ld-head"><span>${u}</span><span style="color:#948a7c;font-size:12px">${items.length} entrevistas</span></div>
      ${sorted.map(rowHtml).join('')}
    </div>`;
  }).join('');
}

function setFiltro(f){filtroTodas=f;renderTodas();}

async function toggleModalidade(id, novoOnline){
  await supa.atualizarAtividade(id, {modalidade: novoOnline?'online':'presencial'});
  const a=atividades.find(x=>String(x['_id'])===String(id));
  if(a) a['Modalidade']=novoOnline?'online':'presencial';
  renderTudo();
}

async function salvarLinkMeet(id, link){
  await supa.atualizarAtividade(id, {link_meet: link});
  const a=atividades.find(x=>String(x['_id'])===String(id));
  if(a) a['Link']=link;
  renderTudo();
}

function copiarMsgEntrevista(nome,data,hora,link){
  const msg=`Olá ${nome}! Sua entrevista está agendada para ${data} às ${hora} — modalidade online.\nLink da reunião: ${link}`;
  navigator.clipboard.writeText(msg).then(()=>alert('✓ Mensagem copiada! Cole no WhatsApp.')).catch(()=>alert('Não foi possível copiar automaticamente.'));
}

function copiarLista(){
  const lista=getAtividadesFiltradas().filter(a=>{
    const {data}=fmtDataHora(a['Data de vencimento']);
    const d=parseData(data);
    return d && d.getTime()===HOJE.getTime();
  });
  if(!lista.length){alert('Nenhuma entrevista hoje');return;}
  const por={};
  lista.forEach(a=>{const u=a['Unidade']||'Sem unidade';if(!por[u])por[u]=[];por[u].push(a);});
  let txt=`📋 *Entrevistas — ${HOJE.toLocaleDateString('pt-BR')}*\n\n`;
  Object.entries(por).forEach(([u,items])=>{
    txt+=`*${u}*\n`;
    const sorted=[...items].sort((a,b)=>(a['Data de vencimento']||'').localeCompare(b['Data de vencimento']||''));
    sorted.forEach(a=>{
      const {hora}=fmtDataHora(a['Data de vencimento']);
      txt+=`${hora} · ${a['Contato']} · ${a['Segmento']||''} · ${a['Responsável']||''}${a['Modalidade']==='online'?' (Online)':''}\n`;
    });
    txt+='\n';
  });
  navigator.clipboard.writeText(txt).then(()=>alert('✓ Copiado! Cole no WhatsApp.')).catch(()=>alert('Selecione e copie manualmente.'));
}

function mudarTab(id){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['todas','alertas','dia'][i]===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
}

init();
</script>
