<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colégio Propósito</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#faf8f4;
    color:#2b2620;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
    position:relative;
    overflow:hidden;
  }

  .textura{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(circle at 15% 20%, rgba(184,134,11,.05), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(184,134,11,.04), transparent 50%);
  }

  .linha-fina{position:fixed;left:0;right:0;height:1px;background:#e8e0d0}
  .linha-topo{top:64px}
  .linha-base{bottom:64px}
  @media(max-width:700px){.linha-fina{display:none}}

  .portal{
    width:100%;
    max-width:400px;
    text-align:center;
    position:relative;
    z-index:1;
    animation:surgir .7s cubic-bezier(.16,1,.3,1);
  }
  @keyframes surgir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .marca{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:15px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:#948a7c;
    margin-bottom:2.75rem;
  }

  .titulo{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-size:clamp(2.4rem, 6vw, 3.2rem);
    line-height:1.08;
    letter-spacing:-.02em;
    color:#2b2620;
    margin-bottom:.9rem;
  }
  .titulo em{font-style:italic;font-weight:400;color:#b8860b}

  .subtitulo{
    font-size:14px;
    color:#7d7364;
    line-height:1.6;
    max-width:320px;
    margin:0 auto 3.25rem;
    font-weight:400;
  }

  .campo-wrap{position:relative;margin-bottom:1.1rem}
  .campo-senha{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    letter-spacing:.08em;
    text-align:center;
    padding:16px 20px;
    border:none;
    border-bottom:1px solid #d4c9b0;
    background:transparent;
    color:#2b2620;
    transition:border-color .25s ease;
  }
  .campo-senha::placeholder{color:#c9bfa8;letter-spacing:.04em}
  .campo-senha:focus{outline:none;border-color:#b8860b}

  .btn-entrar{
    margin-top:2rem;
    padding:14px 0;
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    background:#2b2620;
    color:#faf8f4;
    border:none;
    border-radius:2px;
    cursor:pointer;
    transition:background .2s ease, letter-spacing .2s ease;
  }
  .btn-entrar:hover{background:#b8860b;letter-spacing:.2em}
  .btn-entrar:active{transform:scale(.98)}

  .erro{
    font-size:12px;
    color:#dc2626;
    margin-top:14px;
    opacity:0;
    height:0;
    transition:opacity .25s ease;
  }
  .erro.show{opacity:1;height:auto}

  .rodape{
    margin-top:3.5rem;
    font-size:11px;
    color:#c9bfa8;
    letter-spacing:.05em;
  }

  @media(max-width:480px){
    .titulo{font-size:2.1rem}
  }
</style>
</head>
<body>

<div class="textura"></div>
<div class="linha-fina linha-topo"></div>
<div class="linha-fina linha-base"></div>

<div class="portal">
  <div class="marca">Colégio Propósito</div>

  <h1 class="titulo">A <em>operação</em><br>começa aqui.</h1>
  <p class="subtitulo">Digite sua senha de acesso. O sistema identifica automaticamente sua área de trabalho.</p>

  <div class="campo-wrap">
    <input type="password" class="campo-senha" id="senha-input" placeholder="senha de acesso" autocomplete="off" onkeydown="if(event.key==='Enter')entrar()">
  </div>

  <button class="btn-entrar" onclick="entrar()" id="btn-entrar">Entrar</button>

  <div class="erro" id="erro">Senha não reconhecida. Tente novamente.</div>

  <div class="rodape">Sistema Comercial · Processo Seletivo 2027</div>
</div>

<script src="supabase.js?v=1785422334"></script>
<script>
// Senhas padrão — usadas como respaldo caso o banco ainda não tenha valores customizados
// "Configurações" não tem senha própria — só é liberado pela senha mestra do Gerente
const SENHAS = {
  gerente:      'gerente2027',
  cdr:          'cdr2027',
  closer:       'closer2027',
  entrevistas:  'entre2027',
  playbook:     'play2027',
  matriculador: 'matric2027',
};

// Busca senhas atualizadas (definidas pelo gerente no painel) assim que a página carrega
const btnEntrar = document.getElementById('btn-entrar');
btnEntrar.disabled = true;
btnEntrar.style.opacity = '.5';
btnEntrar.textContent = 'Carregando...';

(async function carregarSenhasAtuais(){
  try{
    const custom = await supa.getConfig('senhas_sistema');
    if(custom) Object.assign(SENHAS, custom);
  }catch(e){ /* mantém as senhas padrão em caso de falha de rede */ }
  btnEntrar.disabled = false;
  btnEntrar.style.opacity = '1';
  btnEntrar.textContent = 'Entrar';
})();

const URLS = {
  gerente:      'gerente.html',
  cdr:          'cdr.html',
  closer:       'closer.html',
  entrevistas:  'entrevistas.html',
  playbook:     'playbook.html',
  matriculador: 'matriculador.html',
  config:       'config.html',
};

function entrar(){
  if(document.getElementById('btn-entrar').disabled) return;
  const senha = document.getElementById('senha-input').value;
  const modulo = Object.keys(SENHAS).find(k => SENHAS[k] === senha);

  if(modulo){
    if(modulo === 'gerente'){
      // Libera todos os módulos, incluindo Configurações (que não tem senha própria)
      Object.keys(SENHAS).forEach(mod => sessionStorage.setItem('acesso_'+mod, '1'));
      sessionStorage.setItem('acesso_config', '1');
    } else {
      sessionStorage.setItem('acesso_'+modulo, '1');
    }
    window.location.href = URLS[modulo];
  } else {
    const erro = document.getElementById('erro');
    erro.classList.add('show');
    const campo = document.getElementById('senha-input');
    campo.value = '';
    campo.focus();
    setTimeout(()=>erro.classList.remove('show'), 3200);
  }
}

document.getElementById('senha-input').focus();
</script>
</body>
</html>
